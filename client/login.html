<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Melodify — Login</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet"
  />

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #080810;
      --surface: #0d0d1a;
      --card: #11111e;
      --border: rgba(255,255,255,0.07);
      --border-focus: rgba(255,61,110,0.45);
      --accent: #ff3d6e;
      --accent2: #7b5ea7;
      --accent3: #00e5c3;
      --text: #f0eeff;
      --muted: #6a6a95;
      --font-head: 'Syne', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);

      display: grid;
      grid-template-columns: 1fr 1fr;

      overflow-x: hidden;
      overflow-y: auto;
    }

    /* ── cursor ───────────────────────────── */

    .cursor {
      width: 10px;
      height: 10px;
      background: var(--accent);
      border-radius: 50%;
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
    }

    .cursor-ring {
      width: 30px;
      height: 30px;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 50%;
      position: fixed;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      transition: .08s linear;
    }

    body:has(input:focus) .cursor {
      background: var(--accent3);
    }

    /* ── left panel ───────────────────────── */

    .visual-panel {
      min-height: 100vh;
      position: relative;
      overflow: hidden;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      padding: 60px;

      background:
        radial-gradient(circle at top left, rgba(123,94,167,.35), transparent 40%),
        radial-gradient(circle at bottom right, rgba(255,61,110,.25), transparent 40%),
        #080810;
    }

    .logo {
      position: absolute;
      top: 30px;
      left: 40px;

      font-family: var(--font-head);
      font-size: 1.5rem;
      font-weight: 800;
    }

    .logo span {
      color: var(--accent);
    }

    .disc {
      width: 280px;
      height: 280px;
      border-radius: 50%;

      background:
        radial-gradient(circle, #1c1c30 15%, #0d0d1a 16%, #0d0d1a 35%, #141428 36%, #0d0d1a 60%);

      animation: spin 8s linear infinite;

      box-shadow:
        0 0 40px rgba(255,61,110,.2),
        inset 0 0 40px rgba(0,0,0,.6);

      margin-bottom: 40px;
    }

    @keyframes spin {

      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }

    }

    .hero-title {
      font-family: var(--font-head);
      font-size: 3rem;
      line-height: 1;
      text-align: center;
      margin-bottom: 16px;
      letter-spacing: -0.05em;
    }

    .hero-title span {
      color: var(--accent);
    }

    .hero-subtitle {
      text-align: center;
      color: var(--muted);
      max-width: 420px;
      line-height: 1.7;
    }

    /* ── form panel ───────────────────────── */

    .form-panel {
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background: var(--surface);

      padding: 60px;

      border-left: 1px solid var(--border);
    }

    .form-box {
      width: 100%;
      max-width: 420px;
    }

    .form-box h1 {
      font-family: var(--font-head);
      font-size: 2.7rem;
      letter-spacing: -0.05em;
      margin-bottom: 12px;
    }

    .form-box p {
      color: var(--muted);
      margin-bottom: 32px;
    }

    .form-box p a {
      color: var(--accent);
      text-decoration: none;
    }

    .field {
      margin-bottom: 22px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: .85rem;
    }

    .field input {
      width: 100%;
      padding: 15px 18px;

      border-radius: 14px;
      border: 1px solid var(--border);

      background: var(--card);
      color: var(--text);

      outline: none;
      font-size: .95rem;

      transition: .2s;
    }

    .field input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 4px rgba(255,61,110,.12);
    }

    .login-btn {
      width: 100%;
      padding: 15px;

      border: none;
      border-radius: 14px;

      background: var(--accent);
      color: white;

      font-size: 1rem;
      font-family: var(--font-head);
      font-weight: 700;

      cursor: pointer;

      transition: .25s;

      box-shadow: 0 0 30px rgba(255,61,110,.3);
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 40px rgba(255,61,110,.45);
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);

      background: var(--card);
      border: 1px solid var(--border);

      padding: 14px 20px;
      border-radius: 12px;

      opacity: 0;
      pointer-events: none;

      transition: .3s;
    }

    .toast.show {
      opacity: 1;
    }

    @media(max-width: 900px) {

      body {
        grid-template-columns: 1fr;
      }

      .visual-panel {
        display: none;
      }

      .form-panel {
        padding: 40px 24px;
      }

    }

  </style>

</head>
<body>

  <div class="cursor" id="cursor"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <!-- left panel -->

  <div class="visual-panel">

```
<div class="logo">
  Melod<span>ify</span>
</div>

<div class="disc"></div>

<h1 class="hero-title">
  Welcome <span>Back.</span>
</h1>

<p class="hero-subtitle">
  Your music, your playlists, your vibe.
  Continue where you left off.
</p>

  </div>

  <!-- right panel -->

  <div class="form-panel">

```
<div class="form-box">

  <h1>Log In</h1>

  <p>
    New to Melodify?
    <a href="signup.html">Create Account →</a>
  </p>

  <form id="loginForm">

    <div class="field">

      <label>Email Address</label>

      <input
        type="email"
        id="loginEmail"
        placeholder="you@example.com"
      />

    </div>

    <div class="field">

      <label>Password</label>

      <input
        type="password"
        id="loginPassword"
        placeholder="Enter password"
      />

    </div>

    <button
      type="submit"
      class="login-btn"
      id="loginBtn"
    >
      Log In
    </button>

  </form>

</div>
```

  </div>

  <div class="toast" id="toast"></div>

  <script src="./js/login.js"></script>

</body>
