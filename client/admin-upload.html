
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Melodify • Admin Upload</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'DM Sans',sans-serif;
      background:
        radial-gradient(circle at top left,#34105f 0%,transparent 30%),
        radial-gradient(circle at bottom right,#ff3d6e22 0%,transparent 30%),
        #0b0714;

      color:#f5f3ff;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:40px;
    }

    .upload-shell{
      width:100%;
      max-width:680px;
    }

    .upload-card{
      background:rgba(255,255,255,.05);
      backdrop-filter:blur(18px);
      border:1px solid rgba(255,255,255,.08);
      border-radius:32px;
      padding:40px;
      box-shadow:
        0 10px 40px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.05);
    }

    .top{
      margin-bottom:32px;
    }

    .label{
      color:#b68cff;
      font-size:.8rem;
      font-weight:700;
      letter-spacing:.14em;
      text-transform:uppercase;
      margin-bottom:10px;
    }

    h1{
      font-size:2.4rem;
      line-height:1.1;
      margin-bottom:12px;
    }

    .sub{
      color:#9f98b5;
      line-height:1.6;
      font-size:.95rem;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:18px;
    }

    .field{
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-bottom:18px;
    }

    .field.full{
      grid-column:1/-1;
    }

    .field label{
      font-size:.9rem;
      color:#d5d0e6;
      font-weight:500;
    }

    input{
      width:100%;
      border:none;
      outline:none;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.08);
      color:white;
      padding:15px 18px;
      border-radius:16px;
      font-size:.95rem;
      transition:.2s;
    }

    input:focus{
      border-color:#b68cff;
      box-shadow:0 0 0 4px rgba(182,140,255,.12);
    }

    input[type=file]{
      padding:14px;
      cursor:pointer;
    }

    .upload-btn{
      width:100%;
      border:none;
      outline:none;
      margin-top:10px;
      padding:16px;
      border-radius:18px;
      font-size:1rem;
      font-weight:700;
      cursor:pointer;

      background:
        linear-gradient(
          135deg,
          #8a2be2,
          #ff3d6e
        );

      color:white;

      transition:
        transform .2s,
        opacity .2s,
        box-shadow .2s;
    }

    .upload-btn:hover{
      transform:translateY(-2px);
      box-shadow:0 12px 30px rgba(255,61,110,.25);
    }

    .upload-btn:active{
      transform:scale(.98);
    }

    .upload-btn.loading{
      opacity:.7;
      pointer-events:none;
    }

    .status{
      margin-top:18px;
      text-align:center;
      font-size:.92rem;
      color:#b68cff;
      min-height:22px;
    }

    @media(max-width:700px){

      .upload-card{
        padding:26px;
      }

      .grid{
        grid-template-columns:1fr;
      }

      h1{
        font-size:1.9rem;
      }

    }

  </style>
</head>

<body>

  <div class="upload-shell">

    <div class="upload-card">

      <div class="top">
        <div class="label">
          Melodify Studio
        </div>

        <h1>
          Upload New Music
        </h1>

        <div class="sub">
          Add songs directly into your streaming platform database.
          Uploaded tracks will instantly appear across Discover,
          Library, Search and Player.
        </div>
      </div>

      <form id="uploadForm">

        <div class="grid">

          <div class="field">
            <label>Song Title</label>
            <input
              type="text"
              id="title"
              placeholder="Blinding Lights"
              required
            />
          </div>

          <div class="field">
            <label>Artist</label>
            <input
              type="text"
              id="artist"
              placeholder="The Weeknd"
              required
            />
          </div>

          <div class="field">
            <label>Album</label>
            <input
              type="text"
              id="album"
              placeholder="After Hours"
            />
          </div>

          <div class="field">
            <label>Genre</label>
            <input
              type="text"
              id="genre"
              placeholder="Pop"
            />
          </div>

          <div class="field full">
            <label>Audio File</label>
            <input
              type="file"
              id="audio"
              accept="audio/*"
              required
            />
          </div>

          <div class="field full">
            <label>Cover Image</label>
            <input
              type="file"
              id="cover"
              accept="image/*"
            />
          </div>

        </div>

        <button
          class="upload-btn"
          type="submit"
          id="uploadBtn"
        >
          Upload Song
        </button>

        <div
          class="status"
          id="status"
        ></div>

      </form>

    </div>

  </div>

  <script src="./js/api.js"></script>
  <script src="./js/admin-upload.js"></script>

</body>
</html>
